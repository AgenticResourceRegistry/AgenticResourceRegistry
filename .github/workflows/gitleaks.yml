name: Secrets Scan

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          # Pinned to gitleaks v8.30.1 (tag commit 83d9cd684c87d95d656c1458ef04895a7f1cbd8e).
          # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the official release.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          cd "$(mktemp -d)"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) BASE=$PR_BASE; HEAD=$PR_HEAD ;;
            merge_group) BASE=$QUEUE_BASE; HEAD=$QUEUE_HEAD ;;
            *) BASE=$PUSH_BASE; HEAD=$PUSH_HEAD ;;
          esac
          if [[ "$BASE" =~ ^0+$ ]]; then
            BASE=$(git rev-parse "$HEAD^")
          fi
          gitleaks detect --source . --log-opts="$BASE..$HEAD" --verbose
