# ─────────────────────────────────────────────────────────────────────────────
# Observal CI — runs on every PR and merge-queue candidate targeting main,
# and on pushes to main.
#
# Recommended branch-protection rules (Settings → Branches → main):
#   Required status checks:
#     • lint
#     • reuse-lint
#     • test (3.11)
#     • test (3.12)
#     • test (3.13)
#     • test (3.14)
#     • web-lint
#     • docker-build
#     • dependency-audit
#   Require a pull request before merging
#   Require approvals: 1
#   Do not allow bypassing the above settings
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Job 0: Path filtering ─────────────────────────────────────────────────────
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # v4 compares merge-queue candidates using merge_group.base_sha/head_sha.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            python:
              - 'observal_cli/**/*.py'
              - 'observal-server/**/*.py'
              - 'tests/**/*.py'
              - 'tools/**/*.py'
              - 'fuzz/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            helm:
              - 'infra/helm/**'
              - 'docs/self-hosting/kubernetes-helm.md'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            docker:
              - 'docker/**'
              - 'observal_cli/**'
              - 'observal-server/**'
              - 'web/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'web/package.json'
              - 'pnpm-lock.yaml'
              - '.env.example'
              - '.github/workflows/ci.yml'

# ── Job 1: Python lint ────────────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Skip if no Python changes
        if: needs.changes.outputs.python != 'true'
        run: |
          echo "::notice::No Python changes detected, skipping lint"
          echo "This job reports success to satisfy branch protection"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs.python == 'true'

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        if: needs.changes.outputs.python == 'true'
        with:
          enable-cache: true

      - name: Install Python 3.13
        if: needs.changes.outputs.python == 'true'
        run: uv python install 3.13

      - name: ruff check
        if: needs.changes.outputs.python == 'true'
        run: uv run --with ruff==0.15.12 ruff check .

      - name: ruff format --check
        if: needs.changes.outputs.python == 'true'
        run: uv run --with ruff==0.15.12 ruff format --check .

# ── Job 2: REUSE license compliance ──────────────────────────────────────────────
  reuse-lint:
    name: reuse-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: REUSE compliance check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6

# ── Job 3: Python tests (matrix) ──────────────────────────────────────────────
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Skip if no Python changes
        if: needs.changes.outputs.python != 'true'
        run: |
          echo "::notice::No Python changes detected, skipping test"
          echo "This job reports success to satisfy branch protection"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs.python == 'true'

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        if: needs.changes.outputs.python == 'true'
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        if: needs.changes.outputs.python == 'true'
        run: uv python install ${{ matrix.python-version }}

      - name: Install project dependencies
        if: needs.changes.outputs.python == 'true'
        run: |
          cd observal-server
          uv sync --python ${{ matrix.python-version }} --group dev

      - name: Run pytest
        if: needs.changes.outputs.python == 'true'
        run: |
          cd observal-server
          uv run \
            --python ${{ matrix.python-version }} \
            --with asyncpg \
            --with atheris \
            --with hypothesis \
            --with pyarrow \
            --with pytest-cov \
            --with pytest-xdist \
            pytest ../tests/ -q -n auto \
              ${{ matrix.python-version == '3.13' && '--cov=../observal_cli --cov=. --cov-report=xml' || '' }}

      - name: Upload coverage to Codecov
        if: needs.changes.outputs.python == 'true' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: observal-server/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Observal/Observal
          disable_search: true
          # Fork pull requests cannot access repository secrets, so Codecov authenticates those tokenlessly.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}

# ── Job 4: Next.js lint + typecheck ───────────────────────────────────────────
  web-lint:
    name: web-lint
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: web

    steps:
      - name: Skip if no web changes
        if: needs.changes.outputs.web != 'true'
        working-directory: .
        run: |
          echo "::notice::No web changes detected, skipping web-lint"
          echo "This job reports success to satisfy branch protection"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs.web == 'true'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        if: needs.changes.outputs.web == 'true'
        with:
          standalone: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: needs.changes.outputs.web == 'true'
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: ESLint
        if: needs.changes.outputs.web == 'true'
        run: pnpm run lint

      - name: TypeScript typecheck
        if: needs.changes.outputs.web == 'true'
        run: pnpm run typecheck

# ── Job 5: Helm chart lint ───────────────────────────────────────────────────
  helm-lint:
    name: helm-lint
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Skip if no Helm changes
        if: needs.changes.outputs.helm != 'true'
        run: |
          echo "::notice::No Helm changes detected, skipping helm-lint"
          echo "This job reports success to satisfy branch protection"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs.helm == 'true'

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        if: needs.changes.outputs.helm == 'true'

      - name: Lint chart
        if: needs.changes.outputs.helm == 'true'
        run: helm lint infra/helm/observal

      - name: Render chart
        if: needs.changes.outputs.helm == 'true'
        run: |
          mkdir -p chart-dist
          helm template observal infra/helm/observal --namespace observal > chart-dist/rendered.yaml

      - name: Validate rendered manifests
        if: needs.changes.outputs.helm == 'true'
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            ghcr.io/yannh/kubeconform@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c \
            -strict \
            -summary \
            -kubernetes-version 1.27.0 \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/c8f4e61c63bc529749125ac566bccc6986e08d45/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json' \
            /work/chart-dist/rendered.yaml

      - name: Verify packaged chart appVersion image tags
        if: needs.changes.outputs.helm == 'true'
        run: |
          VERSION="1.2.3-test"
          mkdir -p chart-dist

          helm package infra/helm/observal \
            --destination chart-dist \
            --version "$VERSION" \
            --app-version "$VERSION"
          helm template observal "chart-dist/observal-${VERSION}.tgz" \
            --namespace observal > chart-dist/rendered.yaml

          API_IMAGE_COUNT="$(grep -c "image: ghcr.io/observal/observal-api:${VERSION}" chart-dist/rendered.yaml)"
          test "$API_IMAGE_COUNT" -ge 3
          grep -q "image: ghcr.io/observal/observal-web:${VERSION}" chart-dist/rendered.yaml

          helm template observal "chart-dist/observal-${VERSION}.tgz" \
            --namespace observal \
            --set api.image.tag=custom-api \
            --set worker.image.tag=custom-worker \
            --set web.image.tag=custom-web > chart-dist/rendered-overrides.yaml

          grep -q "image: ghcr.io/observal/observal-api:custom-api" chart-dist/rendered-overrides.yaml
          grep -q "image: ghcr.io/observal/observal-api:custom-worker" chart-dist/rendered-overrides.yaml
          grep -q "image: ghcr.io/observal/observal-web:custom-web" chart-dist/rendered-overrides.yaml

# ── Job 6: Docker build ───────────────────────────────────────────────────────
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: docker

    steps:
      - name: Skip if no Docker changes
        if: needs.changes.outputs.docker != 'true'
        working-directory: .
        run: |
          echo "::notice::No Docker changes detected, skipping docker-build"
          echo "This job reports success to satisfy branch protection"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs.docker == 'true'

      - name: Create stub .env
        if: needs.changes.outputs.docker == 'true'
        run: touch ../.env

      - name: Build images
        if: needs.changes.outputs.docker == 'true'
        run: docker compose build

      - name: Verify ClickHouse egress restrictions
        if: needs.changes.outputs.docker == 'true'
        run: |
          set -euo pipefail
          container="observal-clickhouse-egress-check"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker run --detach --name "$container" \
            --volume "$PWD/clickhouse/config.d:/etc/clickhouse-server/config.d:ro" \
            clickhouse/clickhouse-server:26.6

          ready=false
          for _ in $(seq 1 60); do
            if docker exec "$container" clickhouse-client --query "SELECT 1" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi

          settings=$(docker exec "$container" clickhouse-client --query \
            "SELECT name, value FROM system.server_settings WHERE name LIKE 'send_crash_reports%' FORMAT TSV")
          if [ -n "$settings" ]; then
            printf '%s\n' "$settings"
            printf '%s\n' "$settings" | awk -F '\t' '$2 != "false" && $2 != "0" { exit 1 }'
          else
            config_ok=false
            for _ in $(seq 1 10); do
              rm -f /tmp/clickhouse-config.xml
              docker cp "$container:/var/lib/clickhouse/preprocessed_configs/config.xml" /tmp/clickhouse-config.xml
              if python3 -c 'from xml.etree import ElementTree as ET; raise SystemExit(ET.parse("/tmp/clickhouse-config.xml").findtext("send_crash_reports/enabled") != "false")'; then
                config_ok=true
                break
              fi
              sleep 1
            done
            test "$config_ok" = true
          fi

          if docker exec "$container" clickhouse-client --query \
            "SELECT * FROM url('https://example.com', 'RawBLOB')" \
            >/tmp/clickhouse-url.out 2>/tmp/clickhouse-url.err; then
            echo "URL table function unexpectedly succeeded"
            exit 1
          fi
          grep -q "UNACCEPTABLE_URL" /tmp/clickhouse-url.err

# ── Job 7: Dependency audit ─────────────────────────────────────────────────
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Run pip-audit
        run: |
          uv python install 3.12
          cd observal-server
          uv run --with pip-audit pip-audit --desc --ignore-vuln PYSEC-2025-183 --ignore-vuln PYSEC-2026-161 --ignore-vuln CVE-2026-47265

      - name: Audit Node dependencies
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  release-policy:
    name: release-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Check release policy and run release tests
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/check_release_policy.py
          python3 -m unittest discover -s tests/release -v
