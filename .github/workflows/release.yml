# Publish exact, validated commits from protected release/X.Y branches.

name: Release

on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      target:
        description: "Release preparation commit SHA to validate and resume"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/observal/observal

jobs:
  # ── Preflight: detect and validate the release commit ─────
  preflight:
    name: Preflight checks
    if: github.repository == 'Observal/Observal'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump_type: ${{ steps.version.outputs.bump_type }}
      channel: ${{ steps.version.outputs.channel }}
      python_version: ${{ steps.version.outputs.python_version }}
      target: ${{ steps.target.outputs.target }}
      is_release: ${{ steps.target.outputs.is_release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Resolve release target
        id: target
        env:
          MANUAL_TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF" =~ ^refs/heads/release/[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Releases must run on release/X.Y, never main or a tag"
            exit 1
          fi
          if [ -n "$MANUAL_TARGET" ]; then
            [[ "$MANUAL_TARGET" =~ ^[0-9a-f]{40}$ ]] || exit 1
            TARGET="$MANUAL_TARGET"
          else
            TARGET=$(python3 tools/release.py --resolve-push \
              --before "$BEFORE" --after "$AFTER" --branch "$GITHUB_REF_NAME")
          fi
          if [ -z "$TARGET" ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Validate release branch and manifest
        id: version
        if: steps.target.outputs.is_release == 'true'
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          python3 tools/release.py --validate-target "$TARGET" \
            --branch "$GITHUB_REF_NAME" --upstream origin >> "$GITHUB_OUTPUT"

  # ── Job 1: Build CLI binaries (5-platform matrix) ──────────
  cli-binaries:
    name: CLI (${{ matrix.os }}-${{ matrix.arch }})
    needs: preflight
    if: needs.preflight.outputs.is_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            artifact: observal-linux-x64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact: observal-linux-arm64
          - os: macos
            arch: arm64
            runner: macos-15
            artifact: observal-macos-arm64
          - os: windows
            arch: x64
            runner: windows-latest
            artifact: observal-windows-x64.exe
          - os: windows
            arch: arm64
            runner: windows-latest
            artifact: observal-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install project and release deps from frozen lockfile
        run: uv sync --frozen --group release

      - name: Build binary
        run: uv run --frozen --group release pyinstaller observal_cli/pyinstaller.spec --noconfirm
        env:
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Rename artifact (Unix)
        if: matrix.os != 'windows'
        run: mv dist/observal dist/${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows'
        run: mv dist/observal.exe dist/${{ matrix.artifact }}

      - name: Smoke-test binary
        run: ./dist/${{ matrix.artifact }} --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  # ── Job 2: Docker images to GHCR (native per-arch builds) ──
  docker-build:
    name: Docker (${{ matrix.image }}-${{ matrix.arch }})
    needs: preflight
    if: needs.preflight.outputs.is_release == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Docker manifest (${{ matrix.image }})
    needs: [preflight, docker-build, tag]
    if: needs.tag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: docker-digest-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: |
          DIST_TAG=$(python3 -c 'import os; from tools.release import distribution_tag, version_tags; print(distribution_tag(os.environ["VERSION"], os.environ["CHANNEL"], version_tags()))')
          IMAGE="${{ env.IMAGE_PREFIX }}-${{ matrix.image }}"
          TAGS=(-t "$IMAGE:$VERSION")
          TAGS+=(-t "$IMAGE:$DIST_TAG")
          docker buildx imagetools create \
            "${TAGS[@]}" \
            $(printf "$IMAGE@sha256:%s " $(ls /tmp/digests/))

  # ── Job 3: Server deployment tarball ───────────────────────
  server-package:
    name: Server package
    needs: preflight
    if: needs.preflight.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false

      - name: Build server tarball
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          STAGING="observal-server-v${VERSION}"
          mkdir -p "$STAGING/clickhouse/users.d"
          mkdir -p "$STAGING/grafana"

          # Standalone compose (pre-built images, no source needed)
          cp docker/server-package/docker-compose.yml "$STAGING/"
          cp docker/server-package/docker-compose.observability.yml "$STAGING/"
          cp docker/server-package/setup.sh "$STAGING/"
          cp docker/server-package/env.template "$STAGING/"
          cp docker/nginx.conf "$STAGING/nginx.conf"
          cp prometheus.yml "$STAGING/"
          cp .env.example "$STAGING/"

          # Supporting configs
          cp -r docker/clickhouse/config.d "$STAGING/clickhouse/config.d"
          cp docker/clickhouse/users.d/memory.xml "$STAGING/clickhouse/users.d/"
          cp -r grafana/provisioning "$STAGING/grafana/provisioning"
          cp -r grafana/dashboards "$STAGING/grafana/dashboards"

          tar -czf "observal-server-v${VERSION}.tar.gz" "$STAGING"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: observal-server-v${{ needs.preflight.outputs.version }}.tar.gz
          path: observal-server-v${{ needs.preflight.outputs.version }}.tar.gz

  # ── Approval gate (all releases) ────────────────────────────
  approve:
    name: Approval gate
    needs: [preflight, cli-binaries, docker-build, server-package]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - env:
          BUMP_TYPE: ${{ needs.preflight.outputs.bump_type }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: echo "$BUMP_TYPE release v$VERSION approved"

  tag:
    name: Create release tag
    needs: [preflight, approve]
    if: needs.approve.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Generate release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.target }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: chainguard-dev/actions/setup-gitsign@9d631658f55713e5f63ca0cc21ee168f81301fd9 # v1.6.30

      # setup-gitsign configures Git but still installs gitsign 0.16.1.
      - name: Install gitsign 0.17.1
        env:
          GITSIGN_VERSION: "0.17.1"
          GITSIGN_SHA256: "69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae"
        run: |
          GITSIGN_BIN=$(mktemp)
          trap 'rm -f "$GITSIGN_BIN"' EXIT
          curl -fLsS \
            "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64" \
            -o "$GITSIGN_BIN"
          printf '%s  %s\n' "$GITSIGN_SHA256" "$GITSIGN_BIN" | sha256sum -c
          install -m 0755 "$GITSIGN_BIN" "$HOME/.gitsign/gitsign"
          gitsign version

      - name: Create or verify tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET: ${{ needs.preflight.outputs.target }}
          GITSIGN_ENABLE_SIGSTORE_GO: "true"
          GITSIGN_REKOR_MODE: "online"
          GITSIGN_REKOR_VERSION: "1"
        run: |
          TAG="v$VERSION"
          verify_tag() {
            for attempt in {1..5}; do
              if gitsign verify-tag "$TAG" \
                --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com"; then
                return 0
              fi
              [ "$attempt" -eq 5 ] && return 1
              echo "Tag verification attempt $attempt failed, retrying in 15 seconds"
              sleep 15
            done
          }
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            [ "$(git rev-parse "$TAG^{commit}")" = "$TARGET" ] || {
              echo "::error::$TAG points to a different commit"
              exit 1
            }
            if verify_tag; then
              echo "$TAG already points to the validated release commit and has a valid Sigstore signature"
              exit 0
            fi
            echo "::error::$TAG must have a valid signature; existing tags cannot be replaced"
            exit 1
          fi
          git tag -s "$TAG" -m "Release $TAG" "$TARGET"
          verify_tag
          git push origin "$TAG"

  # ── Job 4: PyPI publish (after approval) ───────────────────
  pypi:
    name: Publish to PyPI
    needs: [preflight, tag]
    if: needs.tag.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check if already published
        id: published
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/observal-cli/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "observal-cli $VERSION is already on PyPI, skipping publish"
          elif [ "$STATUS" = "404" ]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PyPI version lookup failed: HTTP $STATUS"
            exit 1
          fi

      - name: Publish to PyPI
        if: steps.published.outputs.already_published != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # ── Job 5: npm publish (after approval) ────────────────────
  npm:
    name: Publish to npm
    needs: [preflight, tag]
    if: needs.tag.result == 'success'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from release
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cd packages/pi-extension
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Check if already published
        id: published
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/observal-pi/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "404" ]; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm version lookup failed: HTTP $STATUS"
            exit 1
          fi

      - name: Publish observal-pi
        if: steps.published.outputs.already_published != 'true'
        env:
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          DIST_TAG=$(python3 -c 'import os; from tools.release import distribution_tag, version_tags; print(distribution_tag(os.environ["VERSION"], os.environ["CHANNEL"], version_tags()))')
          cd packages/pi-extension
          npm publish --access public --tag "$DIST_TAG"

  # ── Job 6: Helm chart to GHCR (after approval) ────────────
  helm-chart:
    name: Publish Helm chart
    needs: [preflight, approve, tag]
    if: needs.tag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Lint and package chart
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p chart-dist

          helm lint infra/helm/observal
          helm package infra/helm/observal \
            --destination chart-dist \
            --version "$VERSION" \
            --app-version "$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: observal-helm-chart-v${{ needs.preflight.outputs.version }}
          path: chart-dist/observal-${{ needs.preflight.outputs.version }}.tgz

      - name: Publish chart to GHCR
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          HELM_OCI_REPO="oci://ghcr.io/observal/charts"
          HELM_OCI_REF="ghcr.io/observal/charts/observal"

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

          # Skip if this chart version is already published
          if helm pull "$HELM_OCI_REPO/observal" --version "$VERSION" --destination /tmp 2>/dev/null; then
            echo "Chart $VERSION is already on GHCR, skipping push"
          else
            helm push "chart-dist/observal-${VERSION}.tgz" "$HELM_OCI_REPO"
          fi

          # artifacthub metadata is idempotent, always push
          oras push "${HELM_OCI_REF}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            infra/helm/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  # ── Final: Create GitHub Release with all artifacts ────────
  release:
    name: GitHub Release
    needs: [preflight, cli-binaries, docker-merge, server-package, pypi, npm, helm-chart, tag]
    if: needs.tag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: observal-*

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'observal-*' -o -name '*.tar.gz' \) -exec cp {} release/ \;

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: "release/observal-*"

      - name: Copy attestation bundle into release/
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          test -n "$BUNDLE_PATH" -a -s "$BUNDLE_PATH" || {
            echo "::error::Attestation bundle is missing or empty"
            exit 1
          }
          cp "$BUNDLE_PATH" release/build-provenance.intoto.jsonl
          echo "Bundle copied ($(wc -c < release/build-provenance.intoto.jsonl) bytes)"

      - name: Verify provenance before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verify every attested artifact against the bundle. gh attestation verify
          # validates the Sigstore certificate chain, the signer workflow identity,
          # and the source repository/commit recorded in the provenance.
          # Signatures bind to this exact release branch, not main or a wildcard.
          fail=0
          for f in release/observal-*; do
            echo "Verifying $f"
            gh attestation verify "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle release/build-provenance.intoto.jsonl \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
              || { echo "::error::Provenance verification failed for $f"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "All artifacts verified against the attestation bundle."

      - name: Create or resume GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: |
          VERSION="v$RELEASE_VERSION"
          FLAGS=(--title "Observal $VERSION" --notes-file .github/release-notes.md)
          FLAGS+=(--latest=false)
          if [ "$CHANNEL" != "stable" ]; then
            FLAGS+=(--prerelease)
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            DRAFT=$(gh release view "$VERSION" --json isDraft --jq '.isDraft')
            if [ "$DRAFT" = "true" ]; then
              gh release upload "$VERSION" --clobber release/*
              gh release edit "$VERSION" "${FLAGS[@]}"
            else
              echo "$VERSION is already published; assets will be verified without replacement"
            fi
          else
            gh release create "$VERSION" --draft "${FLAGS[@]}" release/*
          fi

      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          VERSION="v$RELEASE_VERSION"
          EXPECTED=$(find release -maxdepth 1 -type f | wc -l)
          ACTUAL=$(gh release view "$VERSION" --json assets --jq '.assets | length')
          [ "$ACTUAL" -eq "$EXPECTED" ] || {
            echo "::error::Expected $EXPECTED release assets, found $ACTUAL"
            exit 1
          }
          DRAFT=$(gh release view "$VERSION" --json isDraft --jq '.isDraft')
          if [ "$DRAFT" = true ]; then
            gh release edit "$VERSION" --draft=false --latest=false
          fi

  verify:
    name: Verify published release
    needs: [preflight, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify registries and smoke test CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
          PYTHON_VERSION: ${{ needs.preflight.outputs.python_version }}
        run: |
          retry() {
            for attempt in {1..12}; do
              "$@" && return 0
              echo "Attempt $attempt failed, retrying in 10 seconds"
              sleep 10
            done
            return 1
          }
          gh release view "v$VERSION" --repo Observal/Observal --json isDraft --jq '.isDraft' | grep -qx false
          mkdir downloaded
          gh release download "v$VERSION" --repo Observal/Observal --dir downloaded
          (cd downloaded && sha256sum --check checksums.txt)
          chmod +x downloaded/observal-linux-x64
          ./downloaded/observal-linux-x64 --version | grep -F "$PYTHON_VERSION"
          retry curl --fail --silent --show-error "https://pypi.org/pypi/observal-cli/$PYTHON_VERSION/json" -o /dev/null
          retry sh -c "npm view 'observal-pi@$VERSION' version | grep -qx '$VERSION'"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          retry docker buildx imagetools inspect "${{ env.IMAGE_PREFIX }}-api:$VERSION"
          retry docker buildx imagetools inspect "${{ env.IMAGE_PREFIX }}-web:$VERSION"
          retry helm pull oci://ghcr.io/observal/charts/observal --version "$VERSION" --destination /tmp
          retry sh -c "uvx --refresh --from 'observal-cli==$PYTHON_VERSION' observal --version | grep -F '$PYTHON_VERSION'"

  promote:
    name: Promote verified stable release
    needs: [preflight, verify]
    if: needs.preflight.outputs.channel == 'stable' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.target }}
          persist-credentials: false
      - name: Mark newest verified stable as latest
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # Failed-job reruns retain preflight outputs. Recheck current tags here.
          DIST_TAG=$(python3 -c 'import os; from tools.release import distribution_tag, version_tags; print(distribution_tag(os.environ["VERSION"], "stable", version_tags()))')
          if [ "$DIST_TAG" != latest ]; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --latest
          echo "promoted=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [preflight, promote]
    if: needs.promote.outputs.promoted == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      target: ${{ needs.preflight.outputs.target }}
      version: ${{ needs.preflight.outputs.version }}
    secrets: inherit
