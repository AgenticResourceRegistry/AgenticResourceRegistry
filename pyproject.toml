[project]
name = "observal-cli"
version = "1.15.0-dev.0"
description = "Observal MCP Server Registry & Agent Registry CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

dependencies = [
    "typer>=0.12.0",
    "click>=8.3.3",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.3",
    "questionary>=2.0.0",
    "docker>=7.0.0",
    "asyncpg>=0.29.0",
    "packaging>=21.0",
    "loguru>=0.7.0",
]

keywords = ["mcp", "model-context-protocol", "registry", "cli", "agents", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

# Optional extras: only required for specific commands.
# Install with `pip install observal-cli[migrate]` if you need the
# `observal server migrate` Parquet export/import pipeline.
[project.optional-dependencies]
migrate = ["pyarrow>=15.0.0"]

[project.urls]
Homepage = "https://github.com/Observal/Observal"
Repository = "https://github.com/Observal/Observal"
Changelog = "https://github.com/Observal/Observal/blob/main/CHANGELOG.md"
Issues = "https://github.com/Observal/Observal/issues"

[project.scripts]
observal = "observal_cli.main:app"
observal-sandbox-run = "observal_cli.sandbox_runner:main"
observal-sandbox-mcp = "observal_cli.sandbox_mcp:main"
#observal-graphrag-proxy = "observal_cli.graphrag_proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observal_cli", "packages/observal-shared/observal_shared"]

[tool.hatch.build.targets.wheel.force-include]
"packages/pi-extension/extensions/observal.ts" = "observal_cli/_bundled/observal.ts"

# ── Ruff ─────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["observal_cli", "observal-server", "tests"]
extend-exclude = ["observal-server/vendor"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific
    "TID",   # flake8-tidy-imports (import boundary enforcement)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (typer needs this)
    "UP007",  # use X | Y for union (keep Optional for typer compat)
    "N805",   # first argument of a method should be named self (pydantic validators)
    "B904",   # raise from in except (too noisy for HTTPException patterns)
    "SIM105", # contextlib.suppress (explicit try/except is clearer for us)
    "UP042",  # str enum inheritance (needed for SQLAlchemy compatibility)
    "RUF012", # mutable class defaults (pydantic/sqlalchemy models)
]

[tool.ruff.lint.isort]
known-first-party = ["observal_cli", "observal_shared", "models", "schemas", "services", "api"]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "RUF059", "B007", "TID251"]  # unused vars in tests
"observal-server/tests/*" = ["F841", "RUF059", "B007", "TID251", "E402"]  # same for server tests; E402 for importorskip guards
"observal_cli/main.py" = ["E402"]       # imports after app = typer.Typer()
"demo/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ───────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ── Bandit ───────────────────────────────────────────────

[tool.bandit]
exclude_dirs = ["tests", "alembic", ".venv", "node_modules", "vendor"]
skips = [
    "B101",  # assert used in tests
    "B104",  # 0.0.0.0 in string comparisons, not actual binds
    "B310",  # urllib.request.urlopen with known server URLs from config
    "B608",  # ClickHouse {param:Type} and SQLite ? placeholders are parameterized, not injectable
]

[dependency-groups]
fuzz = [
    "hypothesis==6.152.1",
    "loguru==0.7.3",
    "orjson==3.11.9",
]
dev = [
    "fastapi>=0.135.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.49",
    "ruff==0.15.15",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "hypothesis>=6.0",
    "pyarrow>=15.0.0",
]
# Exact pins for reproducible CLI binary builds (release pipeline).
# `uv sync --frozen --group release` in the cli-binaries job installs these.
release = [
    "pyinstaller==6.21.0",
]
