# Azure deployment: web container with API proxy.
# Routes /api/ to the API Container App via its public FQDN.

limit_conn_zone $binary_remote_addr zone=migration_uploads:10m;

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle is precompressed at build time (Dockerfile.web); compress anything else on the fly.
    # Nothing in front of this container is guaranteed to compress: ECS sits behind an ALB, and
    # port 3000 is served directly.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/javascript application/json text/css text/plain text/xml application/xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 168.63.129.16 valid=30s;

    # Stream large migration artifacts without buffering them in nginx.
    location ~ ^/api/v1/admin/migrate/(import|validate)/?$ {
        set $backend "https://observal-staging-api.delightfulground-0a073dc9.centralus.azurecontainerapps.io";
        client_max_body_size 6g;
        client_body_timeout 3600s;
        limit_conn migration_uploads 1;
        limit_conn_status 429;
        proxy_request_buffering off;
        proxy_pass $backend;
        proxy_ssl_server_name on;
        proxy_set_header Host observal-staging-api.delightfulground-0a073dc9.centralus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy API requests to the API Container App
    location /api/ {
        set $backend "https://observal-staging-api.delightfulground-0a073dc9.centralus.azurecontainerapps.io";
        proxy_pass $backend;
        proxy_ssl_server_name on;
        proxy_set_header Host observal-staging-api.delightfulground-0a073dc9.centralus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        client_max_body_size 10m;
    }

    location /health {
        set $backend "https://observal-staging-api.delightfulground-0a073dc9.centralus.azurecontainerapps.io";
        proxy_pass $backend;
        proxy_ssl_server_name on;
        proxy_set_header Host observal-staging-api.delightfulground-0a073dc9.centralus.azurecontainerapps.io;
    }

    # ARD discovery manifest (spec §5.1) and its predecessor path are served by the API.
    location ~ ^/\.well-known/(ard|ai-catalog)\.json$ {
        set $backend "https://observal-staging-api.delightfulground-0a073dc9.centralus.azurecontainerapps.io";
        proxy_pass $backend;
        proxy_ssl_server_name on;
        proxy_set_header Host observal-staging-api.delightfulground-0a073dc9.centralus.azurecontainerapps.io;
    }

    # Static assets with aggressive caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
