services:
  observal-prometheus:
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    ports:
      - "${OBSERVAL_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      observal-api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - observal-net

  observal-grafana:
    profiles: ["grafana"]
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    group_add:
      - "${OBSERVAL_SECRET_GID:-1000}"
    ports:
      - "${OBSERVAL_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_HOST_PORT:-3001}:3000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$${GRAFANA_ADMIN_PASSWORD_FILE:-}" ]; then
          export GF_SECURITY_ADMIN_PASSWORD="$$(cat "$$GRAFANA_ADMIN_PASSWORD_FILE")"
        fi
        if [ -n "$${GRAFANA_CLICKHOUSE_PASSWORD_FILE:-}" ]; then
          export CLICKHOUSE_PASSWORD="$$(cat "$$GRAFANA_CLICKHOUSE_PASSWORD_FILE")"
        fi
        exec /run.sh
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GRAFANA_ADMIN_PASSWORD_FILE=${GRAFANA_ADMIN_PASSWORD_FILE:-}
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse}
      - GRAFANA_CLICKHOUSE_PASSWORD_FILE=${GRAFANA_CLICKHOUSE_PASSWORD_FILE:-}
    volumes:
      - ./secrets/grafana:/run/secrets:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      observal-clickhouse:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - observal-net

volumes:
  grafanadata:
