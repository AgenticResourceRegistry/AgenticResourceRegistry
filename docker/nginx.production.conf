upstream observal_api {
    server observal-api:8000;
}

upstream observal_web {
    server observal-web:3000;
}

limit_conn_zone $binary_remote_addr zone=migration_uploads:10m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Reject requests with non-RFC-compliant Host headers (CVE-2026-48710 mitigation)
    if ($http_host !~* "^[a-z0-9]([a-z0-9\-\.]*[a-z0-9])?(:\d{1,5})?$") {
        return 400;
    }

    ssl_certificate /etc/letsencrypt/live/internal.observal.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/internal.observal.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;

    # Session ingest and reconcile carry full session JSONL; allow up to 10MB
    # (the API enforces the same MAX_REQUEST_SIZE_MB default).
    client_max_body_size 10m;

    location ~ ^/api/v1/admin/migrate/(import|validate)/?$ {
        client_max_body_size 6g;
        client_body_timeout 3600s;
        limit_conn migration_uploads 1;
        limit_conn_status 429;
        proxy_request_buffering off;
        proxy_pass http://observal_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        # Match the API's 10 MiB snapshot cap; migration uploads use the regex location above.
        client_max_body_size 10m;
        proxy_pass http://observal_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /health {
        proxy_pass http://observal_api;
        proxy_set_header Host $host;
    }

    # ARD discovery manifest (spec §5.1) and its predecessor path are served by the API.
    location ~ ^/\.well-known/(ard|ai-catalog)\.json$ {
        proxy_pass http://observal_api;
        proxy_set_header Host $host;
    }

    location /livez {
        proxy_pass http://observal_api;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://observal_api;
        proxy_set_header Host $host;
    }

    location /graphql {
        proxy_pass http://observal_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /v1/ {
        proxy_pass http://observal_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    location / {
        proxy_pass http://observal_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
