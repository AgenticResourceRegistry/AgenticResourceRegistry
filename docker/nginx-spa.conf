# SPA fallback configuration for the web container.
# All non-file requests fall through to index.html for client-side routing.

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle is precompressed at build time (Dockerfile.web); compress anything else on the fly.
    # Nothing in front of this container is guaranteed to compress: ECS sits behind an ALB, and
    # port 3000 is served directly.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/javascript application/json text/css text/plain text/xml application/xml image/svg+xml;

    # Security headers (migrated from Next.js middleware)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static assets with aggressive caching (fingerprinted by Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://observal-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://observal-api:8000;
        proxy_set_header Host $host;
    }

    # ARD discovery manifest (spec §5.1) and its predecessor path are served by the API.
    location ~ ^/\.well-known/(ard|ai-catalog)\.json$ {
        proxy_pass http://observal-api:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback: try file, then directory, then index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
