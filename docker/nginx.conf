# Re-resolve containers through Docker's DNS so recreating observal-api or
# observal-web (any `docker compose up -d` upgrade) does not leave nginx
# proxying to a removed container's address. `resolve` needs nginx >= 1.27.3.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream observal_api {
    zone observal_api 64k;
    server observal-api:8000 resolve;
    keepalive 64;
}

upstream observal_web {
    zone observal_web 64k;
    server observal-web:3000 resolve;
}

# Map connection header: use "upgrade" for WebSocket, empty for keepalive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

limit_conn_zone $binary_remote_addr zone=migration_uploads:10m;

server {
    listen 80;

    # Reject requests with non-RFC-compliant Host headers (CVE-2026-48710 mitigation)
    if ($http_host !~* "^[a-z0-9]([a-z0-9\-\.]*[a-z0-9])?(:\d{1,5})?$") {
        return 400;
    }

    gzip on;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;

    # Reconcile endpoint receives full session JSONL — allow up to 10MB
    client_max_body_size 10m;

    # Block operational metadata paths at the proxy layer (SEC-017).
    location ~* ^/(docs|redoc|openapi\.json|metrics) {
        return 404;
    }

    # Migration artifacts can be several gigabytes. Stream these two authenticated
    # upload endpoints to the API instead of buffering the request in nginx.
    location ~ ^/api/v1/admin/migrate/(import|validate)/?$ {
        client_max_body_size 6g;
        client_body_timeout 3600s;
        limit_conn migration_uploads 1;
        limit_conn_status 429;
        proxy_request_buffering off;
        proxy_pass http://observal_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API routes
    location /api/ {
        proxy_pass http://observal_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep WebSocket subscriptions alive for 1 hour
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://observal_api;
        proxy_set_header Host $host;
    }

    # ARD discovery manifest (spec §5.1) and its predecessor path are served by the API.
    location ~ ^/\.well-known/(ard|ai-catalog)\.json$ {
        proxy_pass http://observal_api;
        proxy_set_header Host $host;
    }

    # Frontend (Vite SPA via nginx)
    location / {
        proxy_pass http://observal_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
