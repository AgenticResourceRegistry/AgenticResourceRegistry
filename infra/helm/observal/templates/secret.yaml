{{- if not .Values.secrets.existingSecret }}
{{- $secretName := include "observal.secretName" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $data := dict }}
{{- if and $existingSecret $existingSecret.data }}
  {{- $data = $existingSecret.data }}
{{- end }}
{{- $pgPass := "" }}
{{- if index $data "POSTGRES_PASSWORD" }}
  {{- $pgPass = index $data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
  {{- $pgPass = .Values.secrets.postgresPassword | default (randAlphaNum 24) }}
{{- end }}
{{- $chPass := "" }}
{{- if index $data "CLICKHOUSE_PASSWORD" }}
  {{- $chPass = index $data "CLICKHOUSE_PASSWORD" | b64dec }}
{{- else }}
  {{- $chPass = .Values.secrets.clickhousePassword | default (randAlphaNum 24) }}
{{- end }}
{{- $secKey := "" }}
{{- if index $data "SECRET_KEY" }}
  {{- $secKey = index $data "SECRET_KEY" | b64dec }}
{{- else }}
  {{- $secKey = .Values.secrets.secretKey | default (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "observal.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observal.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ $secKey | quote }}
  {{- if include "observal.postgres.embedded" . }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://postgres:%s@%s-db:5432/observal" $pgPass (include "observal.fullname" .) | quote }}
  {{- end }}
  {{- if include "observal.clickhouse.embedded" . }}
  CLICKHOUSE_PASSWORD: {{ $chPass | quote }}
  CLICKHOUSE_URL: {{ printf "clickhouse://default:%s@%s-clickhouse:8123/observal" $chPass (include "observal.fullname" .) | quote }}
  {{- end }}
  {{- if include "observal.redis.embedded" . }}
  REDIS_URL: {{ printf "redis://%s-redis:6379" (include "observal.fullname" .) | quote }}
  {{- end }}
{{- end }}
