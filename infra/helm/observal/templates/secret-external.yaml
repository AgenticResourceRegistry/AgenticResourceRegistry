{{- $pg := and .Values.externalPostgres.enabled (not .Values.externalPostgres.existingSecret) }}
{{- $ch := and .Values.externalClickhouse.enabled (not .Values.externalClickhouse.existingSecret) }}
{{- $redis := and .Values.externalRedis.enabled (not .Values.externalRedis.existingSecret) }}
{{- if or $pg $ch $redis }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "observal.externalSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observal.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $pg }}
  DATABASE_URL: {{ include "observal.externalPostgresUrl" . | quote }}
  {{- end }}
  {{- if $ch }}
  CLICKHOUSE_URL: {{ include "observal.externalClickhouseUrl" . | quote }}
  {{- end }}
  {{- if $redis }}
  REDIS_URL: {{ include "observal.externalRedisUrl" . | quote }}
  {{- end }}
{{- end }}
