# =============================================================================
# Observal Helm values
# =============================================================================

global:
  imageRegistry: ""
  imagePullSecrets: []

api:
  image:
    repository: ghcr.io/agenticresourceregistry/observal-api
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  workers: 2
  resources:
    limits:
      memory: 1536Mi
    requests:
      memory: 256Mi
      cpu: 100m

worker:
  image:
    repository: ghcr.io/agenticresourceregistry/observal-api
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      memory: 1536Mi
    requests:
      memory: 256Mi
      cpu: 50m

web:
  image:
    repository: ghcr.io/agenticresourceregistry/observal-web
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      memory: 128Mi
    requests:
      memory: 64Mi
      cpu: 50m

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 256Mi
      cpu: 100m
  storage:
    size: 10Gi
    storageClassName: ""

clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "26.3"
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 3Gi
    requests:
      memory: 512Mi
      cpu: 250m
  storage:
    size: 50Gi
    storageClassName: ""

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 128Mi
      cpu: 50m
  maxmemory: "400mb"
  storage:
    size: 2Gi
    storageClassName: ""

# External services: when enabled, the matching embedded StatefulSet is not deployed.
# existingSecret holds the full connection URL under existingSecretKey; otherwise the
# URL is built from host/port/database/username/password.
externalPostgres:
  enabled: false
  existingSecret: ""
  existingSecretKey: connection-uri
  host: ""
  port: 5432
  database: observal
  username: postgres
  password: ""
  sslMode: ""

externalClickhouse:
  enabled: false
  existingSecret: ""
  existingSecretKey: connection-uri
  host: ""
  port: 8123
  database: observal
  username: default
  password: ""
  secure: false

externalRedis:
  enabled: false
  existingSecret: ""
  existingSecretKey: connection-uri
  host: ""
  port: 6379
  database: 0
  username: ""
  password: ""
  tls: false

ingress:
  enabled: true
  className: nginx
  host: observal.example.com
  tls:
    enabled: false
    secretName: ""
    certManager:
      enabled: false
      issuerName: letsencrypt-prod
      issuerKind: ClusterIssuer
  annotations: {}

secrets:
  # Use a pre-existing Secret instead of creating one. It must contain SECRET_KEY
  # plus, for each embedded service: POSTGRES_PASSWORD + DATABASE_URL,
  # CLICKHOUSE_PASSWORD + CLICKHOUSE_URL, REDIS_URL. External services take their
  # URL from externalX.existingSecret or externalX.host instead.
  existingSecret: ""
  secretKey: ""
  postgresPassword: ""
  clickhousePassword: ""

config:
  logLevel: INFO
  logFormat: json
  jwtSigningAlgorithm: ES256
  jwtKeyDir: /data/keys
  seedDemoAccounts: false

apidata:
  storage:
    size: 5Gi
    storageClassName: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
