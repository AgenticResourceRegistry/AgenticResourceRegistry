[project]
name = "observal-server"
version = "1.15.0-dev.0"
description = "Observal API server"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.136.0,!=0.136.3",
    "starlette>=1.3.1",
    "click>=8.3.3",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic",
    "pydantic-settings>=2.14.2",
    "python-dotenv",
    "email-validator",
    "alembic",
    "httpx",
    "gitpython>=3.1.59",
    "boto3",
    "litellm>=1.88.6,<1.90.0",
    # Required by LiteLLM for the `vertex_ai/*` models the insights settings
    # page offers. Without it every Vertex call fails with "Google Cloud SDK
    # not found", including Express Mode keys that need no GCP project.
    "google-cloud-aiplatform>=1.60.0",
    "redis[hiredis]>=5.0",
    "arq",
    "strawberry-graphql[fastapi]>=0.327.2",
    "authlib>=1.6.11",
    "itsdangerous",
    # >=50.0.0: PYSEC-2026-3552 (PKCS#7 decrypt Bleichenbacher oracle).
    "cryptography>=50.0.0",
    "python3-saml>=1.16.0",
    "slowapi",
    "PyJWT>=2.15.0",
    "aiosqlite>=0.22.1",
    "tenacity>=8.0.0",
    "python-multipart>=0.0.31",
    "packaging>=21.0",
    "fastapi-cache2>=0.2.2",
    "structlog>=24.1.0",
    "loguru>=0.7.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "urllib3>=2.8.0",
    "idna>=3.15",
    "orjson>=3.10.0",
    "xxhash>=3.4.0",
    "pyarrow>=15.0.0",
    "observal-shared",
    "joserfc>=1.6.7",
    "opentelemetry-proto>=1.27",
]

[tool.uv.sources]
observal-shared = { path = "../packages/observal-shared" }

[tool.uv]
# CVE-2026-48710 / CVE-2026-54282 / CVE-2026-54283: starlette <1.3.1 has
# Host header poisoning, url-authority confusion, and unbounded urlencoded
# form parsing. prometheus-fastapi-instrumentator 7.1.0 caps starlette<1.0.0
# but is runtime-compatible with 1.x (only a type annotation differs).
# Remove this override when upstream releases starlette 1.x support.
override-dependencies = [
    "starlette>=1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pyyaml",
    "typer",
    "rich",
]

[tool.coverage.run]
source = ["../observal_cli", "."]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
