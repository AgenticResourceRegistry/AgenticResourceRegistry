[project]
name = "observal-server"
version = "1.17.0-dev.0"
description = "API server for Agentic Resource Registry, a self-hosted, Apache 2.0 registry for sharing coding agent resources"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.136.0,!=0.136.3",
    "starlette>=1.3.1",
    "click>=8.3.3",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic",
    "pydantic-settings>=2.14.2",
    "python-dotenv",
    "email-validator",
    "dnspython>=2.9.0",  # CVE-2026-114605 (DNS decompression DoS)
    "alembic",
    "httpx",
    "gitpython>=3.1.59",
    "boto3",
    "litellm>=1.100.4,<1.101.0",  # >=1.100.4: GHSA-g5ff-637f-6q2m, GHSA-7hp6-4w63-5g45
    # Required by LiteLLM for the `vertex_ai/*` models the insights settings
    # page offers. Without it every Vertex call fails with "Google Cloud SDK
    # not found", including Express Mode keys that need no GCP project.
    "google-cloud-aiplatform>=1.60.0",
    "redis[hiredis]>=5.0",
    "arq",
    "strawberry-graphql[fastapi]>=0.327.2",
    "authlib>=1.9.1",
    "itsdangerous",
    # >=50.0.0: PYSEC-2026-3552 (PKCS#7 decrypt Bleichenbacher oracle).
    "cryptography>=50.0.0",
    "python3-saml>=1.16.0",
    "slowapi",
    # >=2.14.0: CVE-2026-102274 (malformed RSA JWK aborts JWKS parsing)
    # and CVE-2026-101917 (unknown-kid JWKS refresh amplification).
    "PyJWT>=2.15.0",
    "aiosqlite>=0.22.1",
    "tenacity>=8.0.0",
    "python-multipart>=0.0.31",
    "packaging>=21.0",
    "fastapi-cache2>=0.2.2",
    "structlog>=24.1.0",
    "loguru>=0.7.0",
    "prometheus-fastapi-instrumentator>=8.1.0,<9.0.0",  # 8.1 supports patched Starlette 1.x
    "urllib3>=2.8.0",
    "aiohttp>=3.14.4",
    "certifi>=2026.10.19",
    "idna>=3.15",
    "orjson>=3.10.0",
    "xxhash>=3.4.0",
    "pyarrow>=15.0.0",
    "observal-shared",
    "joserfc>=1.6.7",
]

[tool.uv.sources]
observal-shared = { path = "../packages/observal-shared" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pyyaml",
    "typer",
    "rich",
]

[tool.coverage.run]
source = ["../observal_cli", "."]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
