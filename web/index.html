      /* Inter is the UI face for the whole app, matching the design system.

      @font-face {
        font-family: "Inter";
        src: url("/fonts/inter-latin-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      /* Archivo and Albert Sans are retained so any remaining explicit
         references keep resolving rather than falling back to a system face. */
      @font-face {
        font-family: "Archivo";
        src: url("/fonts/archivo-latin-variable.woff2") format("woff2");
        font-weight: 400 900;
        font-display: swap;
      }
      @font-face {
        font-family: "Albert Sans";
        src: url("/fonts/albert-sans-latin-variable.woff2") format("woff2");
        font-weight: 300 700;

      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/fonts/jetbrains-mono-latin-variable.woff2") format("woff2");
